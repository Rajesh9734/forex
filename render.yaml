services:
  - type: web
    name: forex-backtest
    runtime: python
    plan: 0.5c-512mb
    region: singapore
    buildCommand: bash build.sh
    preDeployCommand: python manage.py migrate --noinput
    startCommand: bash start.sh
    healthCheckPath: /healthz/
    numInstances: 1
    disk:
      name: backtest-reports
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DATA_DIR
        value: /var/data
      - key: DATABASE_URL
        fromDatabase:
          name: forex-backtest-db
          property: connectionString
      - key: WEB_CONCURRENCY
        value: "2"

databases:
  - name: forex-backtest-db
    plan: 0.1c-256mb
    region: singapore
    postgresMajorVersion: "18"
    diskSizeGB: 1
    databaseName: forexbacktest
    user: forexbacktest
    ipAllowList: []
