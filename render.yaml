services:
  - type: web
    name: forex-backtest
    runtime: python
    plan: free
    region: singapore
    buildCommand: bash build.sh
    startCommand: bash start.sh
    healthCheckPath: /healthz/
    numInstances: 1
    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_DB_SCHEMA
        value: forex_backtest
      - key: DJANGO_REPORT_STORAGE
        value: database
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: WEB_CONCURRENCY
        value: "1"
